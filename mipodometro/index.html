<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Podómetro</title>
    <link rel="stylesheet" href="style.css">
    <!-- Incluimos Chart.js desde un CDN seguro para la gráfica -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <h1>Mi Podómetro</h1>

    <div class="botones">
        <button id="btnEmpezar">Empezar a Caminar</button>
        <button id="btnParar">Parar</button>
    </div>

    <div class="tarjeta">
        <h3>Pasos dados</h3>
        <div id="contadorPasos" class="numero">0</div>
    </div>

    <div class="tarjeta">
        <h3>Distancia (Km)</h3>
        <div id="contadorKm" class="numero">0.00</div>
    </div>

    <div class="tarjeta">
        <h3>Calorías (Kcal)</h3>
        <div id="contadorKcal" class="numero">0.0</div>
    </div>

    <!-- Sección de Historial y Gráfica -->
    <div class="tarjeta seccion-grafica">
        <h3>Evolución de Pasos</h3>
        <canvas id="graficaPasos"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
